<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة المقالات الحصرية</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; color: #333; }
        .blog-card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: transform 0.2s; }
        .blog-card:hover { transform: translateY(-3px); }
        .btn-read { background-color: #ea580c; color: #fff; border-radius: 6px; font-weight: bold; padding: 8px 20px; text-decoration: none; display: inline-block; }
        .btn-read:hover { background-color: #c2410c; color: #fff; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold fs-3 text-dark m-0">📚 مدونة المقالات</h1>
            <a href="/" class="btn btn-sm btn-outline-secondary">الرئيسية</a>
        </div>
        <hr class="mb-4">
        
        {% if posts %}
            {% for post in posts %}
            <div class="blog-card mb-3">
                <h2 class="fw-bold fs-4 text-dark mb-2">{{ post.title }}</h2>
                <!-- عرض أول 120 حرف فقط كـ وصف قصير للمقال -->
                <p class="text-muted small mb-3">{{ post.content[:120] }}...</p>
                <a href="/blog/post-speed/{{ post.id }}" class="btn-read small">إقرأ المزيد ←</a>
            </div>
            {% endfor %}
        {% else %}
            <div class="text-center py-5 text-muted">لا توجد مقالات منشورة حالياً.</div>
        {% endif %}
    </div>
</body>
</html>
