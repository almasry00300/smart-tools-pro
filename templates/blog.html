<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2246897924284842" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة المقالات - SmartToolsPro</title>
    <meta name="description" content="مدونة منصة SmartToolsPro لأحدث المقالات وشروحات الأدوات الرقمية.">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2246897924204842" crossorigin="anonymous"></script>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 12px; line-height: 1.9; background: #fdfdfd; color: #222; margin: 0; }
        .container { max-width: 850px; margin: 20px auto; width: 100%; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #fff; padding: 20px 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header h1 { font-size: 22px; color: #111; font-weight: bold; margin: 0; }
        .btn-home { text-decoration: none; color: #0d6efd; background: #f1f3f5; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .btn-home:hover { background: #0d6efd; color: #fff; }
        .blog-card { background: #fff; border-radius: 10px; padding: 25px; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .blog-card h2 { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 12px; line-height: 1.5; }
        .blog-card p { font-size: 15px; color: #555; line-height: 1.7; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .ad-space { background: #f8f9fa; border: 2px dashed #ddd; border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 40px; }
        .btn-read { background-color: #0d6efd; color: #ffffff; border-radius: 6px; font-weight: bold; padding: 10px 20px; text-decoration: none; display: inline-block; font-size: 14px; text-align: center; width: 100%; box-sizing: border-box; transition: background 0.3s; }
        .btn-read:hover { background-color: #0b5ed7; }
        .text-center { text-align: center; padding: 40px; color: #666; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 مدونة المقالات</h1>
            <a href="/" class="btn-home">← الرئيسية</a>
        </div>
        {% if posts %}
            {% for post in posts %}
            <div class="blog-card">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content | striptags }}</p>
                <a href="/blog/post-speed/{{ post.id }}" class="btn-read">📖 اقرأ شرح الأداة وطريقة استخدامها</a>
            </div>
            <div class="ad-space">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-2246897924204842"
                     data-ad-slot="xxxxxxxxx"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
            {% endfor %}
        {% else %}
            <div class="text-center">لا توجد مقالات منشورة حالياً.</div>
        {% endif %}
    </div>
</body>
</html>
