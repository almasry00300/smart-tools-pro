<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات الفوري | SmartToolsPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-xl mx-auto mt-12 p-6 bg-white rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">💱 أداة حساب وتحويل العملات</h1>
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-2">المبلغ:</label>
                <input type="number" id="amount" value="1" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-2">من عملة:</label>
                    <select id="fromCurrency" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="USD">دولار أمريكي (USD)</option>
                        <option value="EUR">يورو (EUR)</option>
                        <option value="EGP" selected>جنيه مصري (EGP)</option>
                        <option value="SAR">ريال سعودي (SAR)</option>
                        <option value="AED">درهم إماراتي (AED)</option>
                        <option value="GBP">جنيه استرليني (GBP)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2">إلى عملة:</label>
                    <select id="toCurrency" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="USD" selected>دولار أمريكي (USD)</option>
                        <option value="EUR">يورو (EUR)</option>
                        <option value="EGP">جنيه مصري (EGP)</option>
                        <option value="SAR">ريال سعودي (SAR)</option>
                        <option value="AED">درهم إماراتي (AED)</option>
                        <option value="GBP">جنيه استرليني (GBP)</option>
                    </select>
                </div>
            </div>
            <button onclick="convertCurrency()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">تحويل العملة 🔄</button>
            <div id="result" class="mt-6 p-4 bg-blue-50 text-blue-800 rounded-lg text-center font-bold text-lg hidden"></div>
        </div>
    </div>
    <script>
        async function convertCurrency() {
            const amount = document.getElementById('amount').value;
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            const resultDiv = document.getElementById('result');
            if (!amount || amount <= 0) { alert('يرجى إدخال مبلغ صحيح'); return; }
            try {
                const response = await fetch(`https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`);
                const data = await response.json();
                if (data.rates && data.rates[to]) {
                    const converted = data.rates[to];
                    resultDiv.innerText = `${amount} ${from} = ${converted.toFixed(2)} ${to}`;
                    resultDiv.classList.remove('hidden');
                } else { alert('حدث خطأ أثناء جلب أسعار العملات'); }
            } catch (error) { alert('تعذر الاتصال بخادم أسعار العملات'); }
        }
    </script>
</body>
</html>
