<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title if post else 'عرض المقال' }}</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #fdfdfd !important; color: #222 !important; padding: 20px; line-height: 1.9; margin: 0; }
        .container { max-width: 850px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; }
        h1 { font-size: 24px; color: #111; margin-bottom: 20px; line-height: 1.5; }
        p, div.content { font-size: 16px; color: #444; line-height: 1.8; }
        .btn-back { display: inline-block; margin-top: 30px; text-decoration: none; color: #fff; background: #0d6efd; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
        .btn-back:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container">
        {% if post %}
            <h1>{{ post.title }}</h1>
            <div class="content">
                {{ post.content | safe }}
            </div>
        {% else %}
            <h1>المقال غير موجود</h1>
        {% endif %}
        <br>
        <a href="/blog" class="btn-back">← العودة للمدونة</a>
    </div>
</body>
</html>
