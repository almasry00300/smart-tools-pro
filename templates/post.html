<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b1329; color: #f8fafc; padding: 25px 20px; line-height: 1.8; }
        .container { max-width: 650px; margin: 0 auto; width: 100%; }
        .nav-back { margin-bottom: 25px; }
        .btn-back { text-decoration: none; color: #94a3b8; background: #1e293b; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; display: inline-block; transition: 0.2s; }
        .btn-back:hover { background: #334155; color: #fff; }
        h1 { font-size: 1.7rem; font-weight: 800; color: #ffffff; line-height: 1.5; margin-bottom: 20px; }
        .article-content { font-size: 1.1rem; text-align: justify; white-space: pre-line; color: #cbd5e1; }
        
        /* ستايل العناوين الفرعية والمقاطع والمقاطع المنظمة مع الخط الجانبي */
        .article-content h2, .section-title { 
            font-size: 1.3rem; 
            color: #38bdf8; 
            margin: 30px 0 15px 0; 
            padding-right: 12px; 
            border-right: 4px solid #38bdf8; 
            font-weight: 800; 
            line-height: 1.5;
        }
        .article-content p { margin-bottom: 20px; color: #94a3b8; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-back">
            <a href="/blog-speed" class="btn-back">← العودة للمدونة</a>
        </div>
        
        <article>
            <h1>{{ post.title }}</h1>
            <hr style="border: 0; border-top: 1px solid #1e293b; margin: 20px 0;">
            <div class="article-content">
                {{ post.content | safe }}
            </div>
        </article>
    </div>
</body>
</html>
