<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif; color: #1e293b; line-height: 1.8; }
        .article-content { font-size: 1.1rem; text-align: justify; white-space: pre-line; color: #334155; }
        .btn-back { border-radius: 6px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container py-4" style="max-width: 650px;">
        <nav class="mb-4">
            <a href="/blog" class="btn btn-sm btn-light btn-back text-secondary">← العودة للمدونة</a>
        </nav>
        
        <article>
            <h1 class="fw-bold text-dark lh-base mb-3 fs-2">{{ post.title }}</h1>
            <hr class="my-4">
            <div class="article-content">
                {{ post.content }}
            </div>
        </article>
    </div>
</body>
</html>
