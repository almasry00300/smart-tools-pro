<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2246897924284842" crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سياسة الخصوصية - SmartToolsPro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #ffffff; color: #1e293b; padding: 30px 20px; line-height: 1.8; }
        .container { max-width: 650px; margin: 0 auto; width: 100%; }
        .nav-back { margin-bottom: 30px; }
        .btn-back { text-decoration: none; color: #ea580c; font-weight: bold; font-size: 0.9rem; }
        h1 { font-size: 2rem; font-weight: 800; color: #000000; margin-bottom: 25px; text-align: center; }
        .content { font-size: 1.1rem; text-align: justify; color: #334155; }
        
        /* تنسيق التقسيمات والعناوين الفرعية لتطابق طلبك تماماً */
        .content h2 { 
            font-size: 1.4rem; 
            color: #000000; 
            margin: 35px 0 15px 0; 
            font-weight: 800; 
            border-bottom: 2px solid #ea580c;
            padding-bottom: 5px;
            display: inline-block;
        }
        .content p { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-back"><a href="/" class="btn-back">← العودة للصفحة الرئيسية</a></div>
        <h1>سياسة الخصوصية</h1>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin-bottom: 30px;">
        <div class="content">
            {{ content | safe }}
        </div>
    </div>
</body>
</html>
